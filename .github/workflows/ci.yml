# CLAPP CI — mirrors the local verification battery exactly:
#   bun install && bun run typecheck && bun run lint && bun test
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the runtime the battery is verified against locally;
          # the tech lead bumps this deliberately.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit across all workspace packages)
        run: bun run typecheck

      - name: Lint (eslint)
        run: bun run lint

      - name: Unit tests (bun test)
        run: bun test
