<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks for reaching out! — Nimbus Notes</title>
  <meta name="description" content="Your message to the Nimbus Notes team is on its way.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="logo-link" href="/" aria-label="Nimbus Notes home" data-testid="logo-link">
      <img class="logo" src="assets/logo.svg" alt="Nimbus Notes logo" width="40" height="40">
      <span class="logo-word">Nimbus Notes</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" data-testid="nav-toggle">
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
    </button>
    <nav class="main-nav" aria-label="Main">
      <a href="/" data-testid="nav-home">Home</a>
      <a href="features.html" data-testid="nav-features">Features</a>
      <a href="pricing.html" data-testid="nav-pricing">Pricing</a>
      <a href="contact.html" data-testid="nav-contact">Contact</a>
    </nav>
  </header>

  <main id="main-content">
    <section class="success">
      <h1 data-testid="contact-success">Thanks for reaching out!</h1>
      <p>We'll get back to you within two business days.</p>
      <p><a class="button" href="/" data-testid="back-home">Back to home</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <nav aria-label="Footer">
      <a href="/">Home</a>
      <a href="features.html">Features</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html">Contact</a>
    </nav>
    <form class="newsletter-form" action="newsletter-success.html" method="get">
      <h2>Stay in the loop</h2>
      <label for="newsletter-email">Email address</label>
      <input id="newsletter-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" data-testid="newsletter-email" required>
      <button type="submit" data-testid="newsletter-submit">Subscribe</button>
    </form>
    <p class="copyright"><small>&copy; <span data-year="2026">2026</span> Nimbus Notes. A CLAPP b01 benchmark fixture.</small></p>
  </footer>
</body>
</html>
